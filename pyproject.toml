[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sec-subsidiary-mapping"
version = "0.1.0"
description = "Corporate subsidiary & ownership mapping from SEC EDGAR Exhibit 21 filings"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "thefuzz[speedup]>=0.22",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.1",
]

[project.scripts]
sec-sub = "src.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
